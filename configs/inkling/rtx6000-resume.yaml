recipe: TrainFinetuneRecipeForNextTokenPrediction
seed: 1234
step_scheduler:
  global_batch_size: 1
  local_batch_size: 1
  ckpt_every_steps: 4
  val_every_steps: 1000
  gc_every_steps: 5
  num_epochs: null
  max_steps: 12
  log_remote_every_steps: 1
  save_checkpoint_every_epoch: false
  validate_on_checkpoint: false
dist_env:
  backend: nccl
  timeout_minutes: 15
model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: thinkingmachines/Inkling-2-Mini
  config:
    architectures:
    - Inkling2ForCausalLM
  dtype: bfloat16
  use_liger_kernel: false
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: flex
    linear: torch
    rms_norm: torch
    experts: torch_mm
    dispatcher: torch
    gate_precision: float32
    fake_balanced_gate: false
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: true
  use_sdpa_patching: false
distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 1
  pp_size: 1
  ep_size: 1
  sequence_parallel: false
  activation_checkpointing: true
  reshard_after_forward: true
  defer_fsdp_grad_sync: false
  moe:
    reshard_after_forward: true
    wrap_outer_model: true
    ignore_router_for_ac: true
checkpoint:
  enabled: true
  checkpoint_dir: /workspace/inkling-resume
  load_metadata_with_gloo: true
  dequantize_base_checkpoint: true
  model_save_format: safetensors
  save_consolidated: false
  restore_from: /workspace/inkling-smoke/epoch_0_step_0
loss_fn:
  _target_: nemo_automodel.components.models.inkling2.loss.Inkling2FusedLinearCrossEntropy
  unpadded_vocab_size: 200058
  reduction: sum
  logit_softcapping: 30.0
dataset:
  _target_: nemo_automodel.components.datasets.llm.chat_dataset.ChatDataset
  path_or_dataset_id: /workspace/data/train.jsonl
  split: train
  shuffle_seed: 1234
  seq_length: 1024
  truncation: true
  padding: false
  chat_template: examples/llm_finetune/inkling2/inkling2_chat_template.jinja
  tokenizer:
    pretrained_model_name_or_path: thinkingmachines/Inkling-2-Mini
    pad_token: <|content_model_end_sampling|>
    eos_token: <|content_model_end_sampling|>
packed_sequence:
  packed_sequence_size: 0
dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  batch_size: 1
  num_workers: 0
  pin_memory: true
  drop_last: true
  shuffle: false
  collate_fn: nemo_automodel.components.datasets.utils.default_collater
optimizer:
  _target_: torch.optim.AdamW
  lr: 0.0001
lr_scheduler:
  lr_decay_style: constant
clip_grad_norm:
  max_norm: 1.0
  backend: triton
wandb:
  enable: false
  project: inkling2
  name: inkling2_mini_tulu3_packed128k_ep4_cp4
  mode: online
  dir: logs/inkling2_mini_tulu3_packed128k_ep4_cp4/wandb
peft:
  _target_: nemo_automodel.components._peft.lora.PeftConfig
  target_modules:
  - '*.attn.qkvr'
  - '*.attn.wo_ud'
  dim: 8
  alpha: 32
  dropout: 0.0
  lora_dtype: bfloat16
  use_memory_efficient_lora: true
  use_triton: false
  moe_rank_scaling: false
